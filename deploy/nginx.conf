server {
    listen 80;
    server_name 88popo.kro.kr;

    # 인증서 갱신용 ACME 챌린지. 이 경로만 http로 열어두고 나머지는 https로 보낸다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 88popo.kro.kr;

    ssl_certificate     /etc/letsencrypt/live/88popo.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/88popo.kro.kr/privkey.pem;

    # 백엔드 multipart 한도가 50MB다. 여기서 막히면 413이 먼저 난다.
    client_max_body_size 50m;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 이게 없으면 Spring이 OAuth redirect_uri를 http로 만들어 provider 설정과 어긋난다.
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 호출 타임아웃이 120초라 기본 60초로는 답변 생성 중에 끊긴다.
        proxy_read_timeout 130s;
    }
}
