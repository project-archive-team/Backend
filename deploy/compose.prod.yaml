# EC2에서 도는 구성. 워크플로우가 이 파일과 .env를 서버로 복사한 뒤 `docker compose up -d`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # 인스턴스 전체가 2GB뿐이다. 한도가 없으면 JVM과 서로 밀어내다 OOM으로 죽는다.
    mem_limit: 400m
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive"]
      interval: 5s
      timeout: 3s
      retries: 10
    # DB는 외부로 열지 않는다 — app 컨테이너만 접근한다.

  app:
    image: ${IMAGE:?required}
    restart: unless-stopped
    # JVM은 이 한도를 보고 힙을 잡는다(Dockerfile의 MaxRAMPercentage=75 → 약 640m).
    mem_limit: 850m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/archive
      DB_USER: archive
      DB_PASSWORD: ${DB_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      CRYPTO_PASSWORD: ${CRYPTO_PASSWORD:?required}
      CRYPTO_SALT: ${CRYPTO_SALT:?required}
      # 빈 문자열을 넘기면 Spring이 "설정된 값"으로 받아 OAuth 등록이 실패하고 앱이 부팅되지 않는다.
      # 미설정 시엔 변수를 아예 비워두는 게 아니라 placeholder를 넣어야 한다.
      GITHUB_CLIENT_ID: ${GH_CLIENT_ID:-changeme}
      GITHUB_CLIENT_SECRET: ${GH_CLIENT_SECRET:-changeme}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-changeme}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-changeme}
      # AI는 도커 밖(호스트)에서 돈다. 컨테이너의 localhost는 자기 자신이라 닿지 않으니
      # 호스트를 가리키는 host.docker.internal을 쓴다(아래 extra_hosts로 리눅스에서도 매핑).
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5173/oauth/callback}
    # 외부 노출은 nginx가 맡는다. 호스트 8080은 배포 헬스체크용으로만 연다.
    ports:
      - "127.0.0.1:8080:8080"
    # 리눅스에선 host.docker.internal이 기본 제공되지 않는다 — 이 매핑이 있어야 호스트로 닿는다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # TLS 종료 + 리버스 프록시.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    # 갱신된 인증서는 reload를 해야 물린다. 6시간마다 한 번 흔들어 준다.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  # 인증서 갱신 전용. 최초 발급은 init-cert.sh로 한 번 돌린다.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  pgdata:
  certbot_certs:
  certbot_www:
